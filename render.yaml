services:
  - type: web
    name: candy-forge-webgl
    runtime: static
    branch: render-deploy
    buildCommand: bash tools/render_validate_static_site.sh
    staticPublishPath: ./Submission/WebGLSite
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
